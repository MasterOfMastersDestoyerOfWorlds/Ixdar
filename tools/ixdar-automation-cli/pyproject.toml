[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ixdar-automation-cli"
version = "0.1.0"
description = "Automation CLI utilities for the Ixdar project"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
py-modules = [
    "automation_client",
    "cli_registry",
    "ixdar_cli",
    "scene_scaffolding",
    "trade_route_ops_validation",
    "trade_scenarios",
]
packages = ["cli_commands"]
