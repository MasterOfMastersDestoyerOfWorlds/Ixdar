[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ixdar-automation-cli"
version = "0.1.0"
description = "Automation CLI utilities for the Ixdar project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ixdar-cli = "ixdar_automation_cli.ixdar_cli:cli"
rebuild-krieg-web = "ixdar_automation_cli.rebuild_krieg_web:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["ixdar_automation_cli*"]
