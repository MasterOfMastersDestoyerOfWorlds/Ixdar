<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
    <header class="site-header">
        <nav>
            <a href="{{ "/" | relURL }}" class="site-title">{{ .Site.Title }}</a>
            <div class="nav-links">
                <a href="{{ "/assets/" | relURL }}" class="nav-link">Assets</a>
            </div>
            {{ if .Params.epic }}
            <span class="breadcrumb-sep">/</span>
            <a href="{{ printf "/epics/%s/" (lower .Params.epic) | relURL }}">{{ .Params.epic }}</a>
            {{ end }}
        </nav>
    </header>
    
    <main class="content">
        {{ block "main" . }}{{ end }}
    </main>
    
    <footer class="site-footer">
        <p>Ixdar Project Tracker</p>
    </footer>
</body>
</html>
